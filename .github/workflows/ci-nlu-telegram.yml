name: ci-nlu-telegram

# CI de services/nlu, apps/telegram-bot, y services/core-api +
# services/google-adapter (ambos armados por José, ver sus README). Acotado
# por 'paths' para no interferir con los jobs que agreguen los demás
# integrantes para sus módulos.

on:
  push:
    branches: ["**"]
    paths:
      - "services/nlu/**"
      - "apps/telegram-bot/**"
      - "services/core-api/**"
      - "services/google-adapter/**"
      - "contracts/**"
      - ".github/workflows/ci-nlu-telegram.yml"
  pull_request:
    paths:
      - "services/nlu/**"
      - "apps/telegram-bot/**"
      - "services/core-api/**"
      - "services/google-adapter/**"
      - "contracts/**"
      - ".github/workflows/ci-nlu-telegram.yml"

permissions:
  contents: read

jobs:
  secretos:
    name: escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  paquetes:
    name: ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: ["services/nlu", "apps/telegram-bot", "services/core-api", "services/google-adapter"]
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.pkg }}/package-lock.json

      - name: install (offline, lockfile exacto)
        run: npm ci

      - name: audit de dependencias
        run: npm audit --audit-level=high

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: tests
        run: npm test -- --run

      - name: build
        run: npm run build
